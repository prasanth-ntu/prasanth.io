<script>
  // Override Chart.js immediately when it loads
  (function() {
    // Wait for Chart.js to be available
    function enhanceChartJS() {
      if (typeof Chart !== 'undefined') {
        const originalChart = window.Chart;
        
        // Create enhanced constructor
        function EnhancedChart(ctx, config) {
          // Ensure config exists
          if (!config) config = {};
          if (!config.options) config.options = {};
          
          // Set default interactive options
          config.options.responsive = true;
          config.options.maintainAspectRatio = false;
          
          // Interaction settings
          if (!config.options.interaction) {
            config.options.interaction = {};
          }
          config.options.interaction.mode = 'nearest';
          config.options.interaction.axis = 'xy';
          config.options.interaction.intersect = false;
          
          // Hover settings
          if (!config.options.hover) {
            config.options.hover = {};
          }
          config.options.hover.enabled = true;
          config.options.hover.mode = 'nearest';
          config.options.hover.intersect = false;
          config.options.hover.animationDuration = 200;
          
          // Plugin settings
          if (!config.options.plugins) {
            config.options.plugins = {};
          }
          if (!config.options.plugins.tooltip) {
            config.options.plugins.tooltip = {};
          }
          config.options.plugins.tooltip.enabled = true;
          config.options.plugins.tooltip.mode = 'nearest';
          config.options.plugins.tooltip.intersect = false;
          config.options.plugins.tooltip.backgroundColor = 'rgba(0,0,0,0.8)';
          config.options.plugins.tooltip.titleColor = 'white';
          config.options.plugins.tooltip.bodyColor = 'white';
          config.options.plugins.tooltip.borderColor = '#4a90e2';
          config.options.plugins.tooltip.borderWidth = 1;
          config.options.plugins.tooltip.cornerRadius = 4;
          config.options.plugins.tooltip.padding = 8;
          config.options.plugins.tooltip.displayColors = true;
          
          // Create the chart with enhanced options
          const chart = new originalChart(ctx, config);
          
          console.log('Enhanced chart created with interactivity:', chart);
          return chart;
        }
        
        // Copy all static methods and properties
        Object.setPrototypeOf(EnhancedChart, originalChart);
        Object.setPrototypeOf(EnhancedChart.prototype, originalChart.prototype);
        
        // Copy static properties
        for (let prop in originalChart) {
          if (originalChart.hasOwnProperty(prop)) {
            EnhancedChart[prop] = originalChart[prop];
          }
        }
        
        // Replace the global Chart constructor
        window.Chart = EnhancedChart;
        
        console.log('Chart.js enhanced with automatic interactivity');
        return true;
      }
      return false;
    }
    
    // Try to enhance immediately
    if (!enhanceChartJS()) {
      // If Chart.js isn't loaded yet, wait for it
      const checkInterval = setInterval(() => {
        if (enhanceChartJS()) {
          clearInterval(checkInterval);
        }
      }, 50);
      
      // Also try on script load events
      document.addEventListener('DOMContentLoaded', enhanceChartJS);
      window.addEventListener('load', enhanceChartJS);
    }
  })();
</script>
